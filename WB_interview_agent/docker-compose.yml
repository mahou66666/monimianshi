services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-interview}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-interview}
      POSTGRES_DB: ${POSTGRES_DB:-interview_agent}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-interview} -d ${POSTGRES_DB:-interview_agent}"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_CHECKPOINT_URL: postgresql://${POSTGRES_USER:-interview}:${POSTGRES_PASSWORD:-interview}@postgres:5432/${POSTGRES_DB:-interview_agent}?sslmode=disable
      SILICONFLOW_API_KEY: ${SILICONFLOW_API_KEY:-}
      SILICONFLOW_BASE_URL: ${SILICONFLOW_BASE_URL:-https://api.siliconflow.cn/v1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      REASONING_MODEL: ${REASONING_MODEL:-deepseek-ai/DeepSeek-V4-Flash}
      CHAT_MODEL: ${CHAT_MODEL:-deepseek-ai/DeepSeek-V4-Flash}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-m3}
      QUESTION_DEDUP_THRESHOLD: ${QUESTION_DEDUP_THRESHOLD:-0.90}
      QUESTION_DEDUP_WINDOW: ${QUESTION_DEDUP_WINDOW:-6}
      ALLOW_DANGEROUS_FAISS_DESERIALIZATION: ${ALLOW_DANGEROUS_FAISS_DESERIALIZATION:-false}
      ARCHIVE_REPORTS_ENABLED: ${ARCHIVE_REPORTS_ENABLED:-false}
      ARCHIVE_REDACT_SENSITIVE: ${ARCHIVE_REDACT_SENSITIVE:-true}
      ARCHIVE_INCLUDE_RAW_CHAT: ${ARCHIVE_INCLUDE_RAW_CHAT:-false}
    ports:
      - ${APP_PORT:-8010}:8010
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
