<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980">
  <defs>
    <style>
      .title{font-family:"Microsoft YaHei",Arial,sans-serif;font-size:42px;font-weight:800;fill:#1f2937}
      .sub{font-family:"Microsoft YaHei",Arial,sans-serif;font-size:22px;fill:#64748b}
      .layer{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2}
      .layer-title{font-family:"Microsoft YaHei",Arial,sans-serif;font-size:30px;font-weight:700;fill:#334155}
      .box{stroke-width:2;rx:18;ry:18}
      .box-text{font-family:"Microsoft YaHei",Arial,sans-serif;font-size:23px;font-weight:700;fill:#1f2937;text-anchor:middle}
      .small{font-family:"Microsoft YaHei",Arial,sans-serif;font-size:18px;fill:#475569;text-anchor:middle}
      .arrow{stroke:#2563eb;stroke-width:5;fill:none;marker-end:url(#arrowHead)}
      .flow{stroke:#475569;stroke-width:3;fill:none;marker-end:url(#flowHead)}
      .dash{stroke-dasharray:10 8}
    </style>
    <marker id="arrowHead" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#2563eb"/>
    </marker>
    <marker id="flowHead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M2,2 L9,5 L2,8 Z" fill="#475569"/>
    </marker>
    <linearGradient id="hero" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#e0f2fe"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="980" fill="#ffffff"/>
  <rect x="34" y="28" width="1532" height="924" rx="34" fill="url(#hero)" stroke="#dbeafe" stroke-width="2"/>
  <text x="800" y="86" text-anchor="middle" class="title">AI 模拟面试平台后台系统架构</text>
  <text x="800" y="124" text-anchor="middle" class="sub">Admin Web + Admin Server + MySQL / Redis / 本地文件 / 简历切割算法服务</text>

  <!-- Layers -->
  <rect x="70" y="165" width="1460" height="125" class="layer"/>
  <rect x="70" y="320" width="1460" height="135" class="layer"/>
  <rect x="70" y="485" width="1460" height="170" class="layer"/>
  <rect x="70" y="685" width="1460" height="125" class="layer"/>
  <rect x="70" y="840" width="1460" height="80" class="layer"/>

  <text x="105" y="217" class="layer-title">展示层</text>
  <text x="105" y="378" class="layer-title">接口层</text>
  <text x="105" y="552" class="layer-title">业务层</text>
  <text x="105" y="738" class="layer-title">算法服务层</text>
  <text x="105" y="890" class="layer-title">数据层</text>

  <!-- Display layer -->
  <rect x="360" y="188" width="300" height="76" class="box" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="510" y="222" class="box-text">admin-web</text>
  <text x="510" y="249" class="small">Vue + Element UI</text>
  <rect x="940" y="188" width="300" height="76" class="box" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="1090" y="222" class="box-text">浏览器后台</text>
  <text x="1090" y="249" class="small">用户管理 / 简历 / JD / 评分</text>

  <!-- Interface layer -->
  <rect x="330" y="346" width="280" height="78" class="box" fill="#dcfce7" stroke="#22c55e"/>
  <text x="470" y="381" class="box-text">Controller API</text>
  <text x="470" y="408" class="small">REST 接口统一返回</text>
  <rect x="670" y="346" width="280" height="78" class="box" fill="#dcfce7" stroke="#22c55e"/>
  <text x="810" y="381" class="box-text">登录拦截器</text>
  <text x="810" y="408" class="small">JWT + Redis Token</text>
  <rect x="1010" y="346" width="280" height="78" class="box" fill="#dcfce7" stroke="#22c55e"/>
  <text x="1150" y="381" class="box-text">权限校验</text>
  <text x="1150" y="408" class="small">菜单权限 + 按钮权限</text>

  <!-- Business layer -->
  <rect x="250" y="520" width="210" height="82" class="box" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="355" y="555" class="box-text">用户管理</text>
  <text x="355" y="582" class="small">增删改查 / 权限</text>
  <rect x="500" y="520" width="210" height="82" class="box" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="605" y="555" class="box-text">简历管理</text>
  <text x="605" y="582" class="small">上传 / 解析 / 编辑</text>
  <rect x="750" y="520" width="210" height="82" class="box" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="855" y="555" class="box-text">JD 管理</text>
  <text x="855" y="582" class="small">导入 / 提取 / 指导</text>
  <rect x="1000" y="520" width="210" height="82" class="box" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="1105" y="555" class="box-text">评分结果</text>
  <text x="1105" y="582" class="small">维度分 / 雷达图</text>
  <rect x="1250" y="520" width="210" height="82" class="box" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="1355" y="555" class="box-text">问题库</text>
  <text x="1355" y="582" class="small">通用面试题</text>

  <!-- Algorithm layer -->
  <rect x="430" y="710" width="330" height="75" class="box" fill="#fae8ff" stroke="#c084fc"/>
  <text x="595" y="745" class="box-text">resume-cut-docker</text>
  <text x="595" y="772" class="small">PDF 简历切割与结构化解析</text>
  <rect x="870" y="710" width="330" height="75" class="box" fill="#fae8ff" stroke="#c084fc"/>
  <text x="1035" y="745" class="box-text">异步任务</text>
  <text x="1035" y="772" class="small">批量提取进度与结果回写</text>

  <!-- Data layer -->
  <rect x="360" y="856" width="220" height="48" class="box" fill="#fee2e2" stroke="#f87171"/>
  <text x="470" y="888" class="box-text">MySQL</text>
  <rect x="640" y="856" width="220" height="48" class="box" fill="#fee2e2" stroke="#f87171"/>
  <text x="750" y="888" class="box-text">Redis</text>
  <rect x="920" y="856" width="260" height="48" class="box" fill="#fee2e2" stroke="#f87171"/>
  <text x="1050" y="888" class="box-text">本地文件存储</text>
  <rect x="1240" y="856" width="210" height="48" class="box" fill="#fee2e2" stroke="#f87171"/>
  <text x="1345" y="888" class="box-text">Docker 服务</text>

  <!-- Clean orthogonal arrows. Keep routes in gaps between boxes and layers. -->
  <path d="M510 264 L510 305 L470 305 L470 346" class="arrow"/>
  <path d="M1090 264 L1090 305 L1150 305 L1150 346" class="arrow"/>
  <path d="M810 424 L810 472 L855 472 L855 520" class="arrow"/>
  <path d="M470 424 L470 472 L355 472 L355 520" class="arrow"/>
  <path d="M1150 424 L1150 472 L1105 472 L1105 520" class="arrow"/>

  <path d="M605 602 L605 672 L595 672 L595 710" class="arrow"/>
  <path d="M605 602 L605 630 L1035 630 L1035 710" class="arrow"/>

  <path d="M1035 785 L1035 838 L1050 838 L1050 856" class="arrow"/>
  <path d="M595 785 L595 828 L470 828 L470 856" class="arrow"/>
  <path d="M810 424 L810 816 L750 816 L750 856" class="arrow dash"/>

  <!-- Light internal flow line across interface modules, not entering boxes. -->
  <path d="M610 385 L670 385" class="flow"/>
  <path d="M950 385 L1010 385" class="flow"/>
</svg>
