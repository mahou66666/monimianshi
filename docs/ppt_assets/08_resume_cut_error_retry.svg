<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <style>
      .title{font-family:"Microsoft YaHei",Arial,sans-serif;font-size:44px;font-weight:800;fill:#172554}
      .sub{font-family:"Microsoft YaHei",Arial,sans-serif;font-size:21px;fill:#64748b}
      .box{rx:22;ry:22;stroke-width:2.2}
      .h{font-family:"Microsoft YaHei",Arial,sans-serif;font-size:24px;font-weight:800;fill:#1f2937;text-anchor:middle}
      .p{font-family:"Microsoft YaHei",Arial,sans-serif;font-size:17px;fill:#475569;text-anchor:middle}
      .ok{stroke:#22c55e;stroke-width:5;fill:none;marker-end:url(#okHead)}
      .err{stroke:#ef4444;stroke-width:4.5;fill:none;marker-end:url(#errHead)}
      .tag{font-family:"Microsoft YaHei",Arial,sans-serif;font-size:16px;font-weight:700;fill:#fff;text-anchor:middle}
      .label{font-family:"Microsoft YaHei",Arial,sans-serif;font-size:17px;font-weight:700;fill:#64748b;text-anchor:middle}
    </style>
    <marker id="okHead" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto"><path d="M2,2 L11,6.5 L2,11 Z" fill="#22c55e"/></marker>
    <marker id="errHead" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto"><path d="M2,2 L11,6.5 L2,11 Z" fill="#ef4444"/></marker>
  </defs>
  <rect width="1600" height="900" fill="#fff7ed"/>
  <text x="800" y="72" text-anchor="middle" class="title">算法调用的稳定性与异常兜底</text>
  <text x="800" y="112" text-anchor="middle" class="sub">正常链路保持直线推进，异常链路按类型汇总到批量任务结果，避免单个文件拖垮整个批次</text>

  <!-- Success path -->
  <rect x="95" y="185" width="280" height="120" class="box" fill="#ffffff" stroke="#94a3b8"/>
  <text x="235" y="232" class="h">待解析文件</text>
  <text x="235" y="264" class="p">来自本地 storagePath</text>
  <text x="235" y="289" class="p">PDF / DOC / DOCX</text>

  <rect x="455" y="185" width="280" height="120" class="box" fill="#dcfce7" stroke="#22c55e"/>
  <text x="595" y="232" class="h">有效文件</text>
  <text x="595" y="264" class="p">校验存在且格式支持</text>
  <text x="595" y="289" class="p">继续调用解析服务</text>

  <rect x="815" y="185" width="280" height="120" class="box" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="955" y="232" class="h">LLM API 正常</text>
  <text x="955" y="264" class="p">返回 JSON 结构</text>
  <text x="955" y="289" class="p">ObjectMapper 转 DTO</text>

  <rect x="1175" y="185" width="280" height="120" class="box" fill="#bbf7d0" stroke="#22c55e"/>
  <text x="1315" y="232" class="h">解析成功</text>
  <text x="1315" y="264" class="p">success + 1</text>
  <text x="1315" y="289" class="p">写入结构化结果</text>

  <path d="M375 245 L445 245" class="ok"/>
  <path d="M735 245 L805 245" class="ok"/>
  <path d="M1095 245 L1165 245" class="ok"/>

  <!-- Failure cases row -->
  <text x="800" y="405" class="label">异常分支</text>

  <rect x="105" y="455" width="270" height="130" class="box" fill="#fee2e2" stroke="#fb7185"/>
  <rect x="130" y="474" width="82" height="28" rx="14" fill="#e11d48"/><text x="171" y="494" class="tag">文件问题</text>
  <text x="240" y="526" class="h">文件缺失</text>
  <text x="240" y="558" class="p">Local file not found</text>
  <text x="240" y="582" class="p">不可直接解析</text>

  <rect x="455" y="455" width="270" height="130" class="box" fill="#fee2e2" stroke="#fb7185"/>
  <rect x="480" y="474" width="82" height="28" rx="14" fill="#e11d48"/><text x="521" y="494" class="tag">格式问题</text>
  <text x="590" y="526" class="h">格式不支持</text>
  <text x="590" y="558" class="p">非 PDF / DOC / DOCX</text>
  <text x="590" y="582" class="p">返回错误项</text>

  <rect x="805" y="455" width="270" height="130" class="box" fill="#ffedd5" stroke="#fb923c"/>
  <rect x="830" y="474" width="82" height="28" rx="14" fill="#ea580c"/><text x="871" y="494" class="tag">配置问题</text>
  <text x="940" y="526" class="h">API Key 缺失</text>
  <text x="940" y="558" class="p">Missing API Key</text>
  <text x="940" y="582" class="p">需要补环境变量</text>

  <rect x="1155" y="455" width="270" height="130" class="box" fill="#ffedd5" stroke="#fb923c"/>
  <rect x="1180" y="474" width="82" height="28" rx="14" fill="#ea580c"/><text x="1221" y="494" class="tag">网络问题</text>
  <text x="1290" y="526" class="h">服务超时 / 不可达</text>
  <text x="1290" y="558" class="p">retryable = true</text>
  <text x="1290" y="582" class="p">后台提示 Retry All</text>

  <!-- Failure branch connectors: simple vertical drops then horizontal summary bus. -->
  <path d="M235 305 L235 445" class="err"/>
  <path d="M595 305 L595 445" class="err"/>
  <path d="M955 305 L955 445" class="err"/>
  <path d="M1315 305 L1315 445" class="err"/>

  <!-- Summary -->
  <rect x="540" y="700" width="520" height="92" class="box" fill="#ffffff" stroke="#94a3b8"/>
  <text x="800" y="738" class="h">批量任务汇总</text>
  <text x="800" y="770" class="p">success / failed / retryable 统一反馈给前端进度条</text>

  <path d="M240 585 L240 655 L800 655 L800 690" class="err"/>
  <path d="M590 585 L590 655 L800 655 L800 690" class="err"/>
  <path d="M940 585 L940 655 L800 655 L800 690" class="err"/>
  <path d="M1290 585 L1290 655 L800 655 L800 690" class="err"/>
</svg>
