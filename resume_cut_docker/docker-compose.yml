services:
  resume-cut:
    container_name: resume-cut
    build:
      context: .
      dockerfile: Dockerfile
    image: resume-cut:latest
    ports:
      - "8089:8089"
    environment:
      SERVER_PORT: "8089"
      TZ: Asia/Shanghai
      LLM_API_URL: ${LLM_API_URL:-https://api.siliconflow.cn/v1/chat/completions}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_MODEL: ${LLM_MODEL:-Qwen/Qwen3.8-27B}
      JAVA_OPTS: ${JAVA_OPTS:--Dfile.encoding=UTF-8 -XX:+UseContainerSupport -XX:MaxRAMPercentage=75 -XX:+ExitOnOutOfMemoryError}
    restart: always
