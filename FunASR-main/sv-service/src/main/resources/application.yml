server:
  port: 8082
spring:
  servlet:
    multipart:
      max-file-size: ${SV_MAX_FILE_SIZE:64MB}
      max-request-size: ${SV_MAX_REQUEST_SIZE:64MB}

sv:
  model-path: ${SV_MODEL_PATH:models/speaker-embedding.onnx}
  embedding-path: ${SV_EMBEDDING_PATH:data/blacklist.emb}
  embeddings-dir: ${SV_EMBEDDINGS_DIR:data/blacklist}
  threshold: ${SV_THRESHOLD:0.7}
  sample-rate: 16000
  n-mels: 80
  frame-length-ms: 25
  frame-shift-ms: 10
  fmin: 20.0
  fmax: 7600.0
  pre-emphasis: 0.97

asr:
  ws-uri: ${ASR_WS_URI:ws://127.0.0.1:10095}
  mode: ${ASR_MODE:2pass}
  chunk-size: ${ASR_CHUNK_SIZE:5,10,5}
  chunk-interval: ${ASR_CHUNK_INTERVAL:10}
  sample-rate: ${ASR_SAMPLE_RATE:16000}
  bytes-per-sample: ${ASR_BYTES_PER_SAMPLE:2}
  connect-timeout-ms: ${ASR_CONNECT_TIMEOUT_MS:10000}
  result-timeout-ms: ${ASR_RESULT_TIMEOUT_MS:120000}
  realtime-pacing: ${ASR_REALTIME_PACING:false}
  allow-partial-on-timeout: ${ASR_ALLOW_PARTIAL_ON_TIMEOUT:false}
  wav-name: ${ASR_WAV_NAME:sv-service}
  insecure-skip-tls-verify: ${ASR_INSECURE_SKIP_TLS_VERIFY:false}
